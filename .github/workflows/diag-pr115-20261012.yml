name: Validate upstream PR 115 benchmark
on:
  push:
    branches: [diag/validate-pr115-20261012]
permissions:
  contents: read
jobs:
  focused-benchmark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q gltest/bench gltest_cli/bench.py
      - run: python -m pytest -q tests/gltest/bench/test_runner.py tests/gltest_cli/test_bench.py
